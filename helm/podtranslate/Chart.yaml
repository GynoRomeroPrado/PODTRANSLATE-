apiVersion: v2
name: podtranslate
description: Multi-language podcast transcription and distribution platform
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - podcast
  - transcription
  - translation
  - ai
  - whisper
home: https://github.com/podtranslate/podtranslate
sources:
  - https://github.com/podtranslate/podtranslate
maintainers:
  - name: PodTranslate Team
    email: support@podtranslate.com
dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "17.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: rabbitmq
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: rabbitmq.enabled
