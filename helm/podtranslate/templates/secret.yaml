apiVersion: v1
kind: Secret
metadata:
  name: {{ include "podtranslate.fullname" . }}-secrets
  labels:
    {{- include "podtranslate.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database
  DATABASE_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  DATABASE_URL: {{ include "podtranslate.database.url" . | quote }}

  # Redis
  REDIS_PASSWORD: {{ .Values.redis.auth.password | quote }}
  REDIS_URL: {{ include "podtranslate.redis.url" . | quote }}

  # RabbitMQ
  RABBITMQ_PASSWORD: {{ .Values.rabbitmq.auth.password | quote }}
  RABBITMQ_URL: {{ include "podtranslate.rabbitmq.url" . | quote }}

  # ClickHouse
  {{- if .Values.clickhouse.enabled }}
  CLICKHOUSE_PASSWORD: {{ .Values.clickhouse.password | quote }}
  {{- end }}

  # AI Services
  OPENAI_API_KEY: {{ .Values.secrets.openai.apiKey | quote }}
  DEEPL_API_KEY: {{ .Values.secrets.deepl.apiKey | quote }}

  # Platform APIs
  SPOTIFY_CLIENT_ID: {{ .Values.secrets.spotify.clientId | quote }}
  SPOTIFY_CLIENT_SECRET: {{ .Values.secrets.spotify.clientSecret | quote }}
  APPLE_TEAM_ID: {{ .Values.secrets.apple.teamId | quote }}
  APPLE_KEY_ID: {{ .Values.secrets.apple.keyId | quote }}
  APPLE_PRIVATE_KEY: {{ .Values.secrets.apple.privateKey | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.google.clientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.google.clientSecret | quote }}

  # AWS
  {{- if .Values.s3.enabled }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.aws.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.aws.secretAccessKey | quote }}
  {{- end }}

  # JWT
  JWT_SECRET: {{ randAlphaNum 32 | b64enc | quote }}
