apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "podtranslate.fullname" . }}-config
  labels:
    {{- include "podtranslate.labels" . | nindent 4 }}
data:
  # Database
  DATABASE_HOST: {{ include "podtranslate.postgresql.host" . | quote }}
  DATABASE_PORT: "5432"
  DATABASE_NAME: {{ .Values.postgresql.auth.database | quote }}
  DATABASE_USER: {{ .Values.postgresql.auth.username | quote }}

  # Redis
  REDIS_HOST: {{ include "podtranslate.redis.host" . | quote }}
  REDIS_PORT: "6379"

  # RabbitMQ
  RABBITMQ_HOST: {{ include "podtranslate.rabbitmq.host" . | quote }}
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: {{ .Values.rabbitmq.auth.username | quote }}

  # ClickHouse
  {{- if .Values.clickhouse.enabled }}
  CLICKHOUSE_HOST: {{ .Values.clickhouse.host | quote }}
  CLICKHOUSE_PORT: {{ .Values.clickhouse.port | quote }}
  CLICKHOUSE_DATABASE: {{ .Values.clickhouse.database | quote }}
  CLICKHOUSE_USER: {{ .Values.clickhouse.user | quote }}
  {{- end }}

  # S3
  {{- if .Values.s3.enabled }}
  S3_ENDPOINT: {{ .Values.s3.endpoint | quote }}
  S3_BUCKET: {{ .Values.s3.bucket | quote }}
  S3_REGION: {{ .Values.s3.region | quote }}
  {{- end }}

  # Audio Processing
  WHISPER_MODEL: {{ .Values.audioProcessing.env.WHISPER_MODEL | quote }}
  ENABLE_DIARIZATION: {{ .Values.audioProcessing.env.ENABLE_DIARIZATION | quote }}
  ENABLE_TTS: {{ .Values.audioProcessing.env.ENABLE_TTS | quote }}
