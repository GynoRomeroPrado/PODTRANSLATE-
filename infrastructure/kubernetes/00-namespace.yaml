apiVersion: v1
kind: Namespace
metadata:
  name: podtranslate
  labels:
    name: podtranslate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: podtranslate-config
  namespace: podtranslate
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  WHISPER_MODEL: "large-v3"
  WHISPER_DEVICE: "cuda"
  ENABLE_TTS: "true"
  ENABLE_AUTO_DISTRIBUTION: "true"
  MAX_CONCURRENT_JOBS: "5"
---
apiVersion: v1
kind: Secret
metadata:
  name: podtranslate-secrets
  namespace: podtranslate
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@postgres:5432/podtranslate"
  REDIS_URL: "redis://redis:6379"
  RABBITMQ_URL: "amqp://user:password@rabbitmq:5672"
  OPENAI_API_KEY: "your-openai-key"
  JWT_SECRET: "your-jwt-secret"
  AWS_ACCESS_KEY_ID: "your-aws-key"
  AWS_SECRET_ACCESS_KEY: "your-aws-secret"
