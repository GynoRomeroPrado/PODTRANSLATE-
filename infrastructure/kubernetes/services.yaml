apiVersion: apps/v1
kind: Deployment
metadata:
  name: distribution
  namespace: podtranslate
  labels:
    app: distribution
spec:
  replicas: 2
  selector:
    matchLabels:
      app: distribution
  template:
    metadata:
      labels:
        app: distribution
    spec:
      containers:
      - name: distribution
        image: podtranslate/distribution:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3002
        envFrom:
        - secretRef:
            name: podtranslate-secrets
        - configMapRef:
            name: podtranslate-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: distribution
  namespace: podtranslate
spec:
  type: ClusterIP
  ports:
  - port: 3002
    targetPort: 3002
  selector:
    app: distribution
---
