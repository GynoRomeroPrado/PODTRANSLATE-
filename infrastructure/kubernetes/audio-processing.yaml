apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-processing
  namespace: podtranslate
  labels:
    app: audio-processing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audio-processing
  template:
    metadata:
      labels:
        app: audio-processing
    spec:
      containers:
      - name: audio-processing
        image: podtranslate/audio-processing:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: http
        env:
        - name: WHISPER_MODEL
          valueFrom:
            configMapKeyRef:
              name: podtranslate-config
              key: WHISPER_MODEL
        - name: WHISPER_DEVICE
          valueFrom:
            configMapKeyRef:
              name: podtranslate-config
              key: WHISPER_DEVICE
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: podtranslate-secrets
              key: DATABASE_URL
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: podtranslate-secrets
              key: RABBITMQ_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: podtranslate-secrets
              key: REDIS_URL
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: podtranslate-secrets
              key: OPENAI_API_KEY
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: podtranslate-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: podtranslate-secrets
              key: AWS_SECRET_ACCESS_KEY
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
            nvidia.com/gpu: 1
          limits:
            memory: "4Gi"
            cpu: "2000m"
            nvidia.com/gpu: 1
        volumeMounts:
        - name: models-cache
          mountPath: /tmp/models
        - name: audio-temp
          mountPath: /tmp/audio
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: models-cache
        persistentVolumeClaim:
          claimName: models-cache-pvc
      - name: audio-temp
        emptyDir: {}
      nodeSelector:
        workload: gpu
---
apiVersion: v1
kind: Service
metadata:
  name: audio-processing
  namespace: podtranslate
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
  selector:
    app: audio-processing
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-cache-pvc
  namespace: podtranslate
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard
