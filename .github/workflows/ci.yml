name: PodTranslate CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-audio-processing:
    name: Test Audio Processing Service
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install dependencies
      working-directory: ./services/audio-processing
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov

    - name: Run tests
      working-directory: ./services/audio-processing
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/1
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        pytest tests/ -v --cov=src --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./services/audio-processing/coverage.xml
        flags: audio-processing

  test-api-gateway:
    name: Test API Gateway
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      working-directory: ./services/api-gateway
      run: npm ci

    - name: Run linter
      working-directory: ./services/api-gateway
      run: npm run lint --if-present

    - name: Run tests
      working-directory: ./services/api-gateway
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/1
        JWT_SECRET: test-secret
      run: npm test --if-present

  test-distribution:
    name: Test Distribution Service
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      working-directory: ./services/distribution
      run: npm ci

    - name: Run tests
      working-directory: ./services/distribution
      run: npm test --if-present

  test-ai-tools:
    name: Test AI Tools Service
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      working-directory: ./services/ai-tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio

    - name: Run tests
      working-directory: ./services/ai-tools
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: pytest tests/ -v --if-present

  test-analytics:
    name: Test Analytics Service
    runs-on: ubuntu-latest

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 8123:8123

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      working-directory: ./services/analytics
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio

    - name: Run tests
      working-directory: ./services/analytics
      env:
        CLICKHOUSE_URL: http://localhost:8123
      run: pytest tests/ -v --if-present

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-audio-processing, test-api-gateway, test-distribution, test-ai-tools, test-analytics]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build audio-processing image
      uses: docker/build-push-action@v4
      with:
        context: ./services/audio-processing
        push: false
        tags: podtranslate/audio-processing:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build api-gateway image
      uses: docker/build-push-action@v4
      with:
        context: ./services/api-gateway
        push: false
        tags: podtranslate/api-gateway:latest

    - name: Build distribution image
      uses: docker/build-push-action@v4
      with:
        context: ./services/distribution
        push: false
        tags: podtranslate/distribution:latest

    - name: Build ai-tools image
      uses: docker/build-push-action@v4
      with:
        context: ./services/ai-tools
        push: false
        tags: podtranslate/ai-tools:latest

    - name: Build analytics image
      uses: docker/build-push-action@v4
      with:
        context: ./services/analytics
        push: false
        tags: podtranslate/analytics:latest
